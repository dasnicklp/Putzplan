name = "putzplan-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Die App (Ordner docs/) wird vom Worker mit ausgeliefert: /api/... geht an src/index.js, alles andere sind Dateien
[assets]
directory = "../docs"

# Vor dem ersten Deploy: Datenbank-ID aus "npx wrangler d1 create putzplan" hier eintragen (siehe SETUP.md)
[[d1_databases]]
binding = "DB"
database_name = "putzplan"
database_id = "HIER-DATENBANK-ID-EINTRAGEN"
